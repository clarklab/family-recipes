<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammie’s Recipes</title>
<meta name="description" content="The family recipe box, typed up from the original cards.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='12' width='56' height='40' rx='3' fill='%23fdfaf1' stroke='%232b2521' stroke-width='3'/%3E%3Cpath d='M10 24h44' stroke='%23c0473c' stroke-width='3'/%3E%3Cpath d='M12 34h34M12 42h26' stroke='%236a8cc7' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app" aria-live="polite"></main>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Original recipe card">
  <div class="lb-stage" id="lbStage"><img id="lbImg" alt=""></div>
  <div class="lb-bar">
    <button class="lb-btn" id="lbPrev" aria-label="Previous side">←</button>
    <span class="lb-label" id="lbLabel"></span>
    <button class="lb-btn" id="lbNext" aria-label="Next side">→</button>
    <span class="lb-hint">scroll or tap to zoom · drag to look around</span>
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close">✕ close</button>
  </div>
</div>

<script src="recipes.js"></script>
<script src="app.js"></script>
</body>
</html>
